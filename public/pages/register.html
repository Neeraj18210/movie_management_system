<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account - Neeraj Movie Theatre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
                            <div class="logo-icon"><i class="fas fa-ticket-alt"></i></div>
                            <span>Neeraj <span class="red">Movie</span> <span class="gold">Theatre</span></span>
                        </div>
                        <h1 class="auth-title">Create Account</h1>
                        <p class="auth-subtitle">Join Neeraj Movie Theatre to book and manage cinema tickets in real-time</p>
                    </div>

                    <form id="registerForm">
                        <div class="form-group">
                            <label class="form-label" for="regName">Full Name</label>
                            <input type="text" id="regName" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regEmail">Email Address</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regPhone">Phone Number</label>
                            <input type="tel" id="regPhone" class="form-control" placeholder="+1 (555) 000-0000" autocomplete="tel">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="regPassword">Password (minimum 6 characters)</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;" id="registerSubmitBtn">
                            <i class="fas fa-user-plus"></i> Register Customer Account
                        </button>
                    </form>

                    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                        Already registered? <a href="/pages/login.html" style="color: var(--accent-gold); font-weight: 600;">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
