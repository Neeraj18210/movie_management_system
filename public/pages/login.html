<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Neeraj Movie Theatre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
                            <div class="logo-icon"><i class="fas fa-ticket-alt"></i></div>
                            <span>Neeraj <span class="red">Movie</span> <span class="gold">Theatre</span></span>
                        </div>
                        <h1 class="auth-title">Welcome Back</h1>
                        <p class="auth-subtitle">Sign in to book tickets and manage your reservations</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label" for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;" id="loginSubmitBtn">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                    </form>

                    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                        Don't have an account? <a href="/pages/register.html" style="color: var(--accent-gold); font-weight: 600;">Register here</a>
                    </div>

                    <!-- Quick Demo Credentials -->
                    <div class="demo-credentials-box">
                        <h5><i class="fas fa-bolt"></i> Quick Demo Login</h5>
                        <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.5rem;">Click to pre-fill test accounts seeded in MySQL:</p>
                        <div class="demo-btn-group">
                            <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('customer')">
                                <i class="fas fa-user"></i> Customer Demo
                            </button>
                            <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('admin')">
                                <i class="fas fa-shield-alt" style="color: var(--accent-gold);"></i> Admin Demo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
