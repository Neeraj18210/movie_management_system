<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Neeraj Movie Theatre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <div class="section-header" style="margin-bottom: 2rem;">
                <div>
                    <h1 class="section-title"><i class="fas fa-bookmark"></i> My Ticket Bookings</h1>
                    <p class="section-subtitle">View your active reservations and past tickets stored in MySQL</p>
                </div>
            </div>

            <!-- Bookings List -->
            <div id="myBookingsContainer">
                <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 0.5rem;">Fetching your reservations from MySQL...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/my-bookings.js"></script>
</body>
</html>
