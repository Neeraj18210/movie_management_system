<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies - Neeraj Movie Theatre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <div class="section-header" style="margin-bottom: 2rem;">
                <div>
                    <h1 class="section-title"><i class="fas fa-film"></i> Movies Catalog</h1>
                    <p class="section-subtitle">Browse all current and upcoming movie releases stored in MySQL</p>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="search-filter-card">
                <div class="search-input-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="movieSearchInput" placeholder="Search by title, genre, or keyword...">
                </div>
                <div class="filter-selects">
                    <select id="genreSelect">
                        <option value="all">All Genres</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Action">Action</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Horror">Horror</option>
                        <option value="Romance">Romance</option>
                        <option value="Drama">Drama</option>
                    </select>
                    <select id="languageSelect">
                        <option value="all">All Languages</option>
                        <option value="English">English</option>
                        <option value="Spanish">Spanish</option>
                        <option value="Japanese">Japanese</option>
                        <option value="French">French</option>
                    </select>
                    <select id="sortSelect">
                        <option value="rating">Top Rated</option>
                        <option value="newest">Release Date</option>
                        <option value="title">Alphabetical (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- Movies Grid -->
            <div class="movie-grid" id="allMoviesGrid">
                <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 0.5rem;">Fetching movies from MySQL database...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/movies.js"></script>
</body>
</html>
